name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add Android platform files
        run: flutter create . --platforms=android --project-name pureburn --org com.pureburn

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk PureBurn.apk

      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PureBurn.apk \
            --title "PureBurn APK (latest)" \
            --notes "Built automatically from commit $SHORT on $(date -u +'%Y-%m-%d %H:%M') UTC. Download PureBurn.apk and install it on your Android phone." \
            --target "${{ github.sha }}" \
            --latest

      - name: Also keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureBurn-apk
          path: PureBurn.apk
