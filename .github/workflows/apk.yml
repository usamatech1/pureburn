name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add Android platform files
        run: flutter create . --platforms=android --project-name pureburn --org com.pureburn

      - name: Apply app name and icon
        run: |
          sed -i 's/android:label="[^"]*"/android:label="PureBurn"/' android/app/src/main/AndroidManifest.xml
          cp -r platform_overrides/android/res/. android/app/src/main/res/

      - name: Prepare Android for reminders, steps and app lock
        run: python3 .github/scripts/patch_android.py

      - name: Set up permanent release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          CLEAN=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n"')
          echo "Keystore secret length: ${#CLEAN} characters (the original file has 2848)"
          printf '%s' "$CLEAN" | base64 -d > android/app/release.jks || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-paste the full text of keystore_base64.txt."; exit 1; }
          keytool -list -keystore android/app/release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null || { echo "::error::The keystore could not be opened. Check ANDROID_KEYSTORE_PASSWORD and the keystore secret."; exit 1; }
          if [ -f android/app/build.gradle.kts ]; then
            cat .github/signing/signing.kts.txt >> android/app/build.gradle.kts
          else
            cat .github/signing/signing.groovy.txt >> android/app/build.gradle
          fi

      - name: Warn when no permanent key is set
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set, so the APK is signed with a temporary debug key."

      - name: Get packages
        run: flutter pub get

      # The build number goes up on every run, as Google Play requires for each upload.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build release App Bundle for Google Play
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Name the files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PureBurn.apk
          cp build/app/outputs/bundle/release/app-release.aab PureBurn.aab

      - name: Publish APK and AAB to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PureBurn.apk PureBurn.aab \
            --title "PureBurn (latest)" \
            --notes "Built automatically from commit $SHORT on $(date -u +'%Y-%m-%d %H:%M') UTC, build number ${{ github.run_number }}. PureBurn.apk is for installing on an Android phone. PureBurn.aab is the file for Google Play." \
            --target "${{ github.sha }}" \
            --latest

      - name: Also keep the files as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureBurn-android
          path: |
            PureBurn.apk
            PureBurn.aab
