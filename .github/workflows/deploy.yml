name: Build and deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add web platform files
        run: flutter create . --platforms=web --project-name pureburn

      - name: Apply app name and icons
        run: |
          cp -r platform_overrides/web/. web/
          sed -i 's#<title>[^<]*</title>#<title>PureBurn</title>#' web/index.html
          sed -i 's#content="A new Flutter project."#content="PureBurn: BMI, goals, daily exercise and Pakistani diet plans."#' web/index.html
          sed -i 's#apple-mobile-web-app-title" content="[^"]*"#apple-mobile-web-app-title" content="PureBurn"#' web/index.html
          sed -i 's#"name": "[^"]*"#"name": "PureBurn"#; s#"short_name": "[^"]*"#"short_name": "PureBurn"#; s#"description": "[^"]*"#"description": "BMI, goals, daily exercise and Pakistani diet plans."#; s#"background_color": "[^"]*"#"background_color": "\#000000"#; s#"theme_color": "[^"]*"#"theme_color": "\#000000"#' web/manifest.json

      - name: Add the PureBurn splash screen
        run: python3 .github/scripts/brand_web.py

      - name: Get packages
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define=FB_API_KEY=${{ vars.FB_API_KEY }} --dart-define=FB_PROJECT=${{ vars.FB_PROJECT }} --dart-define=FB_REGION=${{ vars.FB_REGION }} --dart-define=GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} --dart-define=COACH_URL=${{ vars.COACH_URL }} --base-href "/${{ github.event.repository.name }}/"

      - name: Add privacy policy page
        run: cp site/privacy.html site/robots.txt site/sitemap.xml build/web/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
