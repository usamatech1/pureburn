name: Screenshots of the app

# Builds the web app, opens it in a phone-sized browser with sample data and
# publishes a screenshot of every screen to the "preview" release.
# Runs by hand, or when anything inside the preview folder changes.

on:
  workflow_dispatch:
  push:
    paths:
      - "preview/**"
      - ".github/workflows/preview.yml"

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add web platform files and branding
        run: |
          flutter create . --platforms=web --project-name pureburn
          cp -r platform_overrides/web/. web/

      - name: Get packages
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define=FB_API_KEY=${{ vars.FB_API_KEY }} --dart-define=FB_PROJECT=${{ vars.FB_PROJECT }} --dart-define=FB_REGION=${{ vars.FB_REGION }} --dart-define=GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} --dart-define=COACH_URL=${{ vars.COACH_URL }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the browser
        working-directory: preview
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve the app and take screenshots
        timeout-minutes: 12
        run: |
          nohup python3 -m http.server 8080 --directory build/web > /tmp/server.log 2>&1 < /dev/null &
          sleep 3
          curl -sS -o /dev/null -w 'index http %{http_code}\n' http://localhost:8080/
          mkdir -p shots
          cd preview
          BASE_URL=http://localhost:8080/ OUT_DIR=../shots CLIP_DIR=../clip node shoot.mjs 2>&1 | tee ../shots/run-log.txt
          test -s ../shots/01-dashboard.png

      - name: Turn the recording into a video file
        if: always()
        run: |
          sudo apt-get install -y ffmpeg > /dev/null
          if ls clip/*.webm > /dev/null 2>&1; then
            ffmpeg -y -i clip/*.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart shots/animated-preview.mp4
          fi

      - name: Publish screenshots to the preview release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview shots/* \
            --title "App screenshots" \
            --notes "Phone-size screenshots made from commit ${{ github.sha }} with sample data." \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}"
