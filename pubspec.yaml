name: pureburn
description: PureBurn - BMI, goals, daily exercise and Pakistani diet tracker.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  share_plus: ^10.1.4
  crypto: ^3.0.3
  flutter_local_notifications: ^22.0.0
  timezone: ^0.10.0
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  local_auth: ^3.0.2

flutter:
  uses-material-design: true
